<!DOCTYPE html>
<html>
  <head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=1313&amp;path=livereload" data-no-instant defer></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Hugolify - Content Manager</title>
        <link href="/admin/decapcms-icons.css" rel="stylesheet" />
<link href="/admin/decapcms-custom.css" rel="stylesheet" />
      </head>
  <body>
  
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
        <script src="https://unpkg.com/decap-cms@%5e3.0.0/dist/decap-cms.js"></script>



<script>
CMS.registerEditorComponent({
  id: 'alert',
  label: '',
  fields: [
    {
  label: '',
  name: 'text',
  widget: 'string',
  required: false,
  i18n: true 
}, 
    
{
  label: '',
  hint: '',
  name: 'state',
  widget: 'select',
    options: [{ label: 'Danger', value: 'danger' },{ label: 'Dark', value: 'dark' },{ label: 'Info', value: 'info' },{ label: 'Light', value: 'light' },{ label: 'Primary', value: 'primary' },{ label: 'Secondary', value: 'secondary' },{ label: 'Success', value: 'success' },{ label: 'Warning', value: 'warning' },
    ],
    default: 'light',
  required: true,
  i18n: 'duplicate'
}

, 
  ],
  pattern: /{{< alert text="([^"]*)" state="([^"]*)" >}}/,
  fromBlock: function (match) {
    return {
      text: match[1],
      state: match[2],
    };
  },
  toBlock: function (obj) {
    const text = obj.text || '';
    const state = obj.state || '';
    return '{{< alert text="' + text + '" state="' + state + '" >}}';
  },
  toPreview: function (obj) {
    return `<div class="alert alert-${obj.state}">${obj.text}</div>`;
  }
});
CMS.registerEditorComponent({
  id: 'badge',
  label: '',
  fields: [
    {
  label: '',
  name: 'text',
  widget: 'string',
  required: false,
  i18n: true 
}, 
    
{
  label: '',
  hint: '',
  name: 'state',
  widget: 'select',
    options: [{ label: 'Danger', value: 'danger' },{ label: 'Dark', value: 'dark' },{ label: 'Info', value: 'info' },{ label: 'Light', value: 'light' },{ label: 'Primary', value: 'primary' },{ label: 'Secondary', value: 'secondary' },{ label: 'Success', value: 'success' },{ label: 'Warning', value: 'warning' },
    ],
    default: 'light',
  required: true,
  i18n: 'duplicate'
}

, 
  ],
  pattern: /{{< badge text="([^"]*)" state="([^"]*)" >}}/,
  fromBlock: function (match) {
    return {
      text: match[1],
      state: match[2],
    };
  },
  toBlock: function (obj) {
    const text = obj.text || '';
    const state = obj.state || '';
    return '{{< badge text="' + text + '" state="' + state + '" >}}';
  },
  toPreview: function (obj) {
    return `<span class="badge text-bg-${obj.state}">${obj.text}</span>`;
  }
});
CMS.registerEditorComponent({
  id: 'blank_link',
  label: '',
  fields: [
    {
  label: '',
  name: 'text',
  widget: 'string',
  required: false,
  i18n: true 
}, 
    {
      label: '',
      name: 'link',
      widget: 'string'
    }, 
  ],
  pattern: /{{< blank_link text="([^"]*)" link="([^"]*)" >}}/,
  fromBlock: function (match) {
    return {
      text: match[1],
      link: match[2],
    };
  },
  toBlock: function (obj) {
    const text = obj.text || '';
    const link = obj.link || '';
    return '{{< blank_link text="' + text + '" link="' + link + '" >}}';
  },
  toPreview: function (obj) {
    return `<a target="_blank" href="${obj.link}">${obj.text}</a>`;
  }
});
CMS.registerEditorComponent({
  id: 'blockquote',
  label: '',
  fields: [
    {
  label: '',
  name: 'quote',
  widget: 'markdown',
  minimal: true,
  buttons: ['bold', 'italic', 'link'],
  editor_components: [],
  modes: ['rich_text'],
  required: false,
  i18n: true
}
, 
    {
  label: '',
  name: 'title',
  widget: 'string',
  required: false,
  i18n: true 
}, 
    {
  label: '',
  name: 'text',
  widget: 'string',
  required: false,
  i18n: true 
}
  ],
  pattern: /{{< blockquote quote="([^"]*)" title="([^"]*)" text="([^"]*)" >}}/,
  fromBlock: function (match) {
    return {
      quote: match[1],
      title: match[2],
      text: match[3]
    };
  },
  toBlock: function (obj) {
    const quote = obj.quote || '';
    const title = obj.title || '';
    const text = obj.text || '';
    return '{{< blockquote quote="' + quote + '" title="' + title + '" text="' + text + '" >}}';
  },
  toPreview: function (obj) {
    return `
      <figure class="quote">
        <blockquote>${obj.quote}</blockquote>
        <figcaption>
          <div>
            <cite>${obj.title}</cite>
            ${obj.text}
          </div>
        </figcaption>
      </figure>`;
  }
});
CMS.registerEditorComponent({
  id: 'button',
  label: '',
  fields: [
    {
  label: '',
  name: 'text',
  widget: 'string',
  required: false,
  i18n: true 
}, 
    {
  label: '',
  name: 'url',
  widget: 'string',
  required: false,
  i18n: true 
}, 
    {
  label: '',
  name: 'blank',
  widget: 'boolean',
  required: false,
  i18n: true
}
  ],
  pattern: /{{< button text="([^"]*)" url="([^"]*)" blank="(true|false)" >}}/,
  fromBlock: function (match) {
    return {
      text: match[1],
      url: match[2],
      blank: match[3]
    };
  },
  toBlock: function (obj) {
    const text = obj.text || '';
    const url = obj.url || '';
    const blank = obj.blank === true ? 'true' : 'false';
    return '{{< button text="' + text + '" url="' + url + '" blank="' + blank + '" >}}';
  },
  toPreview: function (obj) {
    return `<a class="btn" href="${obj.url}">${obj.text}</a>`;
  }
});
CMS.registerEditorComponent({
  id: 'details',
  label: '',
  fields: [
    {
  label: '',
  name: 'name',
  widget: 'string',
  required: false,
  i18n: true 
}, 
    {
  label: '',
  name: 'title',
  widget: 'string',
  required: false,
  i18n: true 
}, 
    {
      name: 'summary',
      label: 'Summary',
      widget: 'string'
    },
    {
      name: 'contents',
      label: 'Contents',
      widget: 'markdown'
    }
  ],
  pattern: /{{< details name="([^"]*)" title="([^"]*)" summary="([^"]*)" >}}([\s\S]*?){{< \/details >}}/,

  fromBlock: function (match) {
    return {
      name: match[1],
      title: match[2],
      summary: match[3],
      contents: match[4]
    };
  },
  toBlock: function (obj) {
    const name = obj.name || '';
    const title = obj.title || '';
    const summary = obj.summary || '';
    const contents = obj.contents || '';
    return '{{< details name="' + name + '" title="' + title + '" summary="' + summary + '" >}}' + contents + '{{< /details >}}';
  },
  toPreview: function (obj) {
    return `<details><summary>${obj.summary}</summary>${obj.contents}</details>`;
  }
});
CMS.registerEditorComponent({
  id: 'map',
  label: '',
  fields: [
    {
      label: 'Markers',
      name: 'markers',
      widget: 'text'
    }
  ],
  pattern: /{{< map markers=`(.*)` >}}/,
  fromBlock: function (match) {
    return {
      markers: match[1]
    };
  },
  toBlock: function (obj) {
    const markers = obj.markers || '';
    return (
      '{{< map markers=`' +
      markers +
      '` >}}'
    );
  },
  toPreview: function (obj) {
    return `map widget`;
  }
});
CMS.registerEditorComponent({
  id: 'twitter',
  label: '',
  fields: [
    {
      label: '',
      name: 'user',
      widget: 'string'
    },
    {
      label: '',
      name: 'id',
      widget: 'string'
    }
  ],
  pattern: /{{< tweet user="(.*?)" id="(.*)" >}}/,
  fromBlock: function (match) {
    return {
      user: match[1],
      id: match[2]
    };
  },
  toBlock: function (obj) {
    const user = obj.user || '';
    const id = obj.id || '';
    return '{{< tweet user="' + user + '" id="' + id + '" >}}';
  },
  toPreview: function (obj) {
    return '{{&lt; tweet user=&#34;${obj.user}&#34; id=&#34;${obj.id}&#34; &gt;}}';
  }
});
CMS.registerEditorComponent({
  id: 'youtube',
  label: '',
  fields: [
    {
      name: 'id',
      label: '',
      widget: 'string'
    },
    {
  label: '',
  name: 'title',
  widget: 'string',
  required: false,
  i18n: true 
}
  ],
  pattern: /{{< youtube id="(.*)" title="(.*?)" class="youtube" >}}/,
  fromBlock: function (match) {
    return {
      id: match[1],
      title: match[2]
    };
  },
  toBlock: function (obj) {
    const id = obj.id || '';
    const title = obj.title || '';
    return '{{< youtube id="' + id + '" title="' + title + '" class="youtube" >}}';
  },
  toPreview: function (obj) {
    return '&lt;img src=&#34;https://i3.ytimg.com/vi/${obj.id}/hqdefault.jpg&#34; alt=&#34;&#34; /&gt;';
  }
});


</script>

      </body>
</html>
