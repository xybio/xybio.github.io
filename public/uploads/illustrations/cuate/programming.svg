<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a55e1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#335eea;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f9fbfd"/>
  
  <!-- 显示器 -->
  <rect x="60" y="60" width="280" height="180" rx="10" fill="#ffffff" stroke="#d9e2ef" stroke-width="3"/>
  <rect x="75" y="75" width="250" height="140" fill="#161c2d"/>
  
  <!-- 代码编辑器界面 -->
  <rect x="75" y="75" width="250" height="25" fill="#384c74"/>
  <circle cx="90" cy="87" r="4" fill="#d52f43"/>
  <circle cx="105" cy="87" r="4" fill="#fad776"/>
  <circle cx="120" cy="87" r="4" fill="#42ba96"/>
  
  <!-- 代码行 -->
  <g transform="translate(85,110)">
    <rect x="0" y="0" width="60" height="3" fill="#6a55e1"/>
    <rect x="70" y="0" width="40" height="3" fill="#42ba96"/>
    <rect x="120" y="0" width="30" height="3" fill="#fad776"/>
    
    <rect x="10" y="10" width="80" height="3" fill="#335eea"/>
    <rect x="100" y="10" width="50" height="3" fill="#42ba96"/>
    
    <rect x="20" y="20" width="70" height="3" fill="#fad776"/>
    <rect x="100" y="20" width="60" height="3" fill="#6a55e1"/>
    
    <rect x="10" y="30" width="90" height="3" fill="#335eea"/>
    <rect x="110" y="30" width="40" height="3" fill="#42ba96"/>
    
    <rect x="0" y="40" width="100" height="3" fill="#6a55e1"/>
    <rect x="110" y="40" width="35" height="3" fill="#fad776"/>
    
    <rect x="20" y="50" width="75" height="3" fill="#42ba96"/>
    <rect x="105" y="50" width="45" height="3" fill="#335eea"/>
    
    <rect x="0" y="60" width="85" height="3" fill="#fad776"/>
    <rect x="95" y="60" width="55" height="3" fill="#6a55e1"/>
  </g>
  
  <!-- 侧边文件树 -->
  <rect x="75" y="100" width="60" height="115" fill="#f1f4f8"/>
  <rect x="80" y="110" width="50" height="2" fill="#3d5480"/>
  <rect x="85" y="120" width="40" height="2" fill="#869ab8"/>
  <rect x="85" y="130" width="35" height="2" fill="#869ab8"/>
  <rect x="80" y="140" width="45" height="2" fill="#3d5480"/>
  <rect x="85" y="150" width="38" height="2" fill="#869ab8"/>
  
  <!-- 终端窗口 -->
  <rect x="200" y="160" width="120" height="50" fill="#161c2d" rx="4"/>
  <rect x="205" y="165" width="6" height="2" fill="#42ba96"/>
  <rect x="215" y="165" width="40" height="2" fill="#ffffff"/>
  <rect x="205" y="175" width="80" height="2" fill="#335eea"/>
  <rect x="205" y="185" width="30" height="2" fill="#fad776"/>
  <rect x="240" y="185" width="20" height="2" fill="#ffffff"/>
  <rect x="205" y="195" width="6" height="2" fill="#42ba96"/>
  <rect x="215" y="195" width="12" height="2" fill="#ffffff"/>
  <circle cx="230" cy="196" r="2" fill="#42ba96" opacity="0.8"/>
  
  <!-- 装饰元素 -->
  <circle cx="50" cy="50" r="15" fill="url(#progGrad)" opacity="0.4"/>
  <circle cx="350" cy="80" r="20" fill="#42ba96" opacity="0.3"/>
  <circle cx="30" cy="250" r="12" fill="#fad776" opacity="0.5"/>
  <circle cx="370" cy="250" r="18" fill="#6a55e1" opacity="0.3"/>
  
  <!-- 代码图标装饰 -->
  <g transform="translate(320,120)">
    <rect x="0" y="0" width="30" height="20" rx="3" fill="#ffffff" stroke="#d9e2ef"/>
    <rect x="2" y="2" width="26" height="16" fill="#161c2d"/>
    <rect x="4" y="4" width="8" height="1" fill="#335eea"/>
    <rect x="4" y="7" width="12" height="1" fill="#42ba96"/>
    <rect x="4" y="10" width="6" height="1" fill="#fad776"/>
    <rect x="4" y="13" width="10" height="1" fill="#6a55e1"/>
  </g>
  
  <!-- 标题 -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#161c2d">编程开发</text>
</svg>
