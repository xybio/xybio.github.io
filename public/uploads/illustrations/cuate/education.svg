<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42ba96;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#335eea;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f9fbfd"/>
  
  <!-- 书籍 -->
  <g transform="translate(80,80)">
    <!-- 主书 -->
    <rect x="0" y="60" width="120" height="80" fill="#335eea" rx="4"/>
    <rect x="5" y="55" width="120" height="80" fill="#ffffff" stroke="#d9e2ef" stroke-width="2" rx="4"/>
    <rect x="10" y="65" width="110" height="4" fill="#f1f4f8"/>
    <rect x="10" y="75" width="90" height="3" fill="#3d5480"/>
    <rect x="10" y="85" width="100" height="3" fill="#3d5480"/>
    <rect x="10" y="95" width="80" height="3" fill="#3d5480"/>
    <rect x="10" y="105" width="95" height="3" fill="#3d5480"/>
    
    <!-- 侧边书籍 -->
    <rect x="-15" y="70" width="15" height="70" fill="#42ba96" rx="2"/>
    <rect x="125" y="75" width="15" height="65" fill="#fad776" rx="2"/>
    <rect x="140" y="70" width="15" height="70" fill="#6a55e1" rx="2"/>
  </g>
  
  <!-- 笔记本电脑 -->
  <g transform="translate(220,120)">
    <rect x="0" y="0" width="120" height="80" fill="#384c74" rx="6"/>
    <rect x="5" y="5" width="110" height="60" fill="#161c2d"/>
    <rect x="10" y="10" width="100" height="50" fill="#ffffff"/>
    
    <!-- 屏幕内容 -->
    <rect x="15" y="15" width="90" height="8" fill="#f1f4f8"/>
    <rect x="20" y="28" width="15" height="15" fill="#335eea" rx="2"/>
    <rect x="40" y="30" width="50" height="2" fill="#3d5480"/>
    <rect x="40" y="35" width="40" height="2" fill="#869ab8"/>
    <rect x="40" y="40" width="35" height="2" fill="#869ab8"/>
    
    <rect x="20" y="48" width="15" height="8" fill="#42ba96" rx="1"/>
    <rect x="40" y="50" width="45" height="2" fill="#3d5480"/>
    <rect x="40" y="54" width="30" height="2" fill="#869ab8"/>
    
    <!-- 键盘 -->
    <rect x="0" y="70" width="120" height="10" fill="#d9e2ef" rx="5"/>
  </g>
  
  <!-- 学士帽 -->
  <g transform="translate(150,40)">
    <rect x="0" y="20" width="60" height="4" fill="#161c2d"/>
    <polygon points="30,0 50,15 10,15" fill="#335eea"/>
    <rect x="48" y="15" width="2" height="15" fill="#3d5480"/>
    <circle cx="49" r="3" cy="30" fill="#fad776"/>
  </g>
  
  <!-- 装饰元素 -->
  <circle cx="50" cy="50" r="20" fill="url(#eduGrad)" opacity="0.4"/>
  <circle cx="350" cy="60" r="15" fill="#42ba96" opacity="0.5"/>
  <circle cx="40" cy="250" r="18" fill="#fad776" opacity="0.4"/>
  <circle cx="360" cy="250" r="22" fill="#6a55e1" opacity="0.3"/>
  
  <!-- 知识图标 -->
  <g transform="translate(320,180)">
    <circle cx="15" cy="15" r="15" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
    <path d="M8,15 L12,19 L22,9" stroke="#42ba96" stroke-width="2" fill="none"/>
  </g>
  
  <!-- 学习进度条 -->
  <g transform="translate(60,240)">
    <rect x="0" y="0" width="200" height="8" fill="#f1f4f8" rx="4"/>
    <rect x="0" y="0" width="140" height="8" fill="#335eea" rx="4"/>
    <text x="210" y="6" font-family="Arial, sans-serif" font-size="10" fill="#3d5480">70%</text>
  </g>
  
  <!-- 标题 -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#161c2d">教育学习</text>
</svg>
