TLA对肺癌发展作用及分子机制研究","desc":"山西省青年基金项目，涵盖泛癌种表达分析及免疫检查点的调控机制。","url":"/research/btla-lung-cancer/","type":"科研"},{"title":"主要农作物抗逆优质种质资源创新与发掘","desc":"山西省重点研发计划，涉及“名优”谷子与“帽干”小麦的组学数据分析。","url":"/research/crop-germplasm-innovation/","type":"科研"},{"title":"LINCRC作为胃透明细胞癌新靶点的鉴定和应用研究","desc":"山西省重点研发计划，聚焦于 lincRNA 调控网络在胃透明细胞癌中的分子机制。","url":"/research/lincrc-gastric-cancer/","type":"科研"},{"title":"国际泛基因组学大会 (PAG 2023) 青年学者论坛口头报告","desc":"受邀在全球动植物基因组学大会上汇报我们在作物泛基因组构建和结构变异挖掘上的最新进展。","url":"/research/sample-conference/","type":"科研"},{"title":"基于深度学习的单细胞转录组无监督聚类方法研究","desc":"提出了一种全新的基于图神经网络的 scRNA-seq 无监督聚类算法框架，在多项基准测试中达到了 SOTA。","url":"/research/sample-paper/","type":"科研"},{"title":"一种基于空间转录组学数据的肿瘤异质性识别方法及存储介质","desc":"通过多模态数据融合技术，结合病理图像与空间表达谱，精准识别肿瘤微环境中的异质性克隆。","url":"/research/sample-patent/","type":"科研"},{"title":"基于云原生的生信自动化工作流引擎系统 V1.0","desc":"自主研发的高并发多组学数据分析调度系统，支持云原生容器化部署与断点续传。","url":"/research/sample-software/","type":"科研"},{"title":"乡村儿童科学素养提升计划 —— 生物信息学科普课堂","desc":"面向西部山区小学开展科普支教，设计了以趣味基因组学为主题的系列互动课程，累计覆盖 300+ 名学生。","url":"/practice/sample-charity/","type":"实践"},{"title":"第三届全国生物信息学大赛 —— 基因调控网络推断赛道","desc":"带领 3 人小组参加全国生物信息学竞赛，在基因调控网络推断赛道中开发了基于 Transformer 的创新方案，最终获得决赛二等奖。","url":"/practice/sample-competition/","type":"实践"}];

  (() => {
    let isOpen = false;
    let selectedIndex = 0;
    let visibleResults = [];

    const overlay = document.getElementById('cmd-k-overlay');
    const input = document.getElementById('cmd-k-input');
    const resultsContainer = document.getElementById('cmd-k-results');
    const emptyState = document.getElementById('cmd-k-empty');
    const closeBtn = document.getElementById('cmd-k-close');

    if (!overlay || !input || !resultsContainer || !emptyState) return;

    const renderResults = (query) => {
      selectedIndex = 0;
      if (!query) {
        visibleResults = searchData.slice(0, 5);
        emptyState.textContent = '推荐内容';
        emptyState.style.display = 'block';
      } else {
        const lowerQuery = query.toLowerCase();
        visibleResults = searchData.filter(item => 
          item.title.toLowerCase().includes(lowerQuery) || 
          item.desc.toLowerCase().includes(lowerQuery)
        ).slice(0, 8);
        emptyState.style.display = 'none';
        if (visibleResults.length === 0) {
          emptyState.textContent = '无匹配结果';
          emptyState.style.display = 'block';
        }
      }

      resultsContainer.querySelectorAll('.cmd-k-item').forEach(el => el.remove());

      visibleResults.forEach((item, idx) => {
        const el = document.createElement('a');
        el.className = 'cmd-k-item';
        el.href = item.url;
        el.setAttribute('data-selected', idx === 0 ? 'true' : 'false');
        el.innerHTML = `
          <span class="cmd-k-type">${item.type}</span>
          <div class="cmd-k-content">
            <div class="cmd-k-title">${item.title}</div>
            <div class="cmd-k-desc">${item.desc}</div>
          </div>
        `;
        resultsContainer.appendChild(el);
      });
    };

    const openModal = () => {
      isOpen = true;
      overlay.removeAttribute('hidden');
      document.body.style.overflow = 'hidden';
      input.value = '';
      renderResults('');
      setTimeout(() => input.focus(), 50);
    };

    const closeModal = () => {
      isOpen = false;
      overlay.setAttribute('hidden', '');
      document.body.style.overflow = '';
    };

    const updateSelection = () => {
      const items = resultsContainer.querySelectorAll('.cmd-k-item');
      items.forEach((item, idx) => {
        if (idx === selectedIndex) {
          item.setAttribute('data-selected', 'true');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.setAttribute('data-selected', 'false');
        }
      });
    };

    document.addEventListener('click', (e) => { if (e.target.closest('.cmd-k-trigger')) openModal(); });
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        isOpen ? closeModal() : openModal();
      }
      if (e.key === 'Escape' && isOpen) {
        closeModal();
      }
    });

    input.addEventListener('input', (e) => {
      renderResults(e.target.value.trim());
    });

    input.addEventListener('keydown', (e) => {
      if (!visibleResults.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % visibleResults.length;
        updateSelection();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + visibleResults.length) % visibleResults.length;
        updateSelection();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        window.location.href = visibleResults[selectedIndex].url;
      }
    });
  })();
})();</script> <script type="module">document.addEventListener("click",e=>{const t=e.target;if(!(t instanceof Element)||t.closest("a, button, input, label, select, textarea"))return;const n=t.closest("[data-card-link]");if(!(n instanceof HTMLElement))return;const a=n.dataset.cardLink;a&&(window.location.href=a)});document.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const t=document.activeElement;if(!(t instanceof HTMLElement)||!t.matches("[data-card-link]"))return;e.preventDefault();const n=t.dataset.cardLink;n&&(window.location.href=n)});const c=document.getElementById("theme-toggle");c&&c.addEventListener("click",()=>{const t=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=t,localStorage.setItem("theme",t)});document.addEventListener("keydown",e=>{e.target instanceof HTMLInputElement||e.target instanceof HTMLTextAreaElement||(e.key==="n"||e.key==="N")&&(window.location.href="/notes/")});</script> <script type="module">document.addEventListener("astro:after-swap",()=>{const t=window.location.pathname;document.querySelectorAll(".nav-links a").forEach(e=>{e.getAttribute("href")===t?e.setAttribute("aria-current","page"):e.removeAttribute("aria-current")})});</script> <script>
