<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#335eea;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3d5480;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f9fbfd"/>
  
  <!-- 电脑屏幕 -->
  <rect x="80" y="80" width="240" height="150" rx="8" fill="#ffffff" stroke="#d9e2ef" stroke-width="2"/>
  <rect x="90" y="90" width="220" height="120" fill="#161c2d"/>
  
  <!-- 代码行 -->
  <rect x="100" y="100" width="80" height="4" fill="#335eea"/>
  <rect x="100" y="110" width="120" height="4" fill="#42ba96"/>
  <rect x="100" y="120" width="60" height="4" fill="#fad776"/>
  <rect x="100" y="130" width="100" height="4" fill="#6a55e1"/>
  <rect x="100" y="140" width="140" height="4" fill="#335eea"/>
  <rect x="100" y="150" width="90" height="4" fill="#42ba96"/>
  <rect x="100" y="160" width="110" height="4" fill="#fad776"/>
  
  <!-- 数据图表 -->
  <g transform="translate(250,100)">
    <rect x="0" y="40" width="8" height="20" fill="#335eea"/>
    <rect x="12" y="30" width="8" height="30" fill="#42ba96"/>
    <rect x="24" y="35" width="8" height="25" fill="#fad776"/>
    <rect x="36" y="25" width="8" height="35" fill="#6a55e1"/>
  </g>
  
  <!-- DNA螺旋装饰 -->
  <g transform="translate(50,50)">
    <path d="M0,20 Q10,10 20,20 Q30,30 40,20" stroke="#335eea" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M0,20 Q10,30 20,20 Q30,10 40,20" stroke="#335eea" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  
  <!-- 装饰元素 -->
  <circle cx="350" cy="50" r="20" fill="url(#grad1)" opacity="0.3"/>
  <circle cx="30" cy="250" r="15" fill="#42ba96" opacity="0.4"/>
  <circle cx="370" cy="270" r="12" fill="#fad776" opacity="0.5"/>
  
  <!-- 标题文字 -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#161c2d">数据分析</text>
</svg>
