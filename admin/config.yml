# 后端配置
backend:
  name: git-gateway
  branch: main

# 媒体文件配置
media_folder: static/images
public_folder: /images

# 内容集合定义
collections:
  # 博客文章
  - name: 'posts'
    label: '博客文章'
    folder: 'content/post'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: false
    fields:
      - { label: '标题', name: 'title', widget: 'string' }
      - { label: '发布日期', name: 'date', widget: 'datetime' }
      - { label: '描述', name: 'description', widget: 'string', required: false }
      - { label: '分类', name: 'categories', widget: 'list', required: false }
      - { label: '标签', name: 'tags', widget: 'list', required: false }
      - { label: '封面图', name: 'image', widget: 'image', required: false }
      - { label: '草稿', name: 'draft', widget: 'boolean', default: false, required: false }
      - { label: '权重', name: 'weight', widget: 'number', required: false }
      - { label: '正文', name: 'body', widget: 'markdown' }

  # 页面内容
  - name: 'pages'
    label: '页面'
    folder: 'content/page'
    create: true
    slug: '{{slug}}'
    fields:
      - { label: '标题', name: 'title', widget: 'string' }
      - { label: '描述', name: 'description', widget: 'string', required: false }
      - { label: '正文', name: 'body', widget: 'markdown' }