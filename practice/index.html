">document.addEventListener("click",e=>{const t=e.target;if(!(t instanceof Element)||t.closest("a, button, input, label, select, textarea"))return;const n=t.closest("[data-card-link]");if(!(n instanceof HTMLElement))return;const a=n.dataset.cardLink;a&&(window.location.href=a)});document.addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const t=document.activeElement;if(!(t instanceof HTMLElement)||!t.matches("[data-card-link]"))return;e.preventDefault();const n=t.dataset.cardLink;n&&(window.location.href=n)});</script> </body> </html> <script>
  (() => {
    const modules = Array.from(document.querySelectorAll('.practice-module'));
    if (!modules.length) return;

    modules.forEach((module) => {
      const head = module.querySelector('.practice-module-head');
      const monthItems = Array.from(module.querySelectorAll('.practice-month-list [data-month]'));
      const monthBlocks = Array.from(module.querySelectorAll('.practice-year-block[data-month]'));
      if (!head || !monthItems.length || !monthBlocks.length) return;

      const setActiveMonth = (month) => {
        monthItems.forEach((item) => {
          item.dataset.active = item.dataset.month === month ? 'true' : 'false';
        });
      };

      const getCurrentMonth = () => {
        const anchor = window.innerHeight * 0.3;
        let current = monthBlocks[0];
        monthBlocks.forEach((block) => {
          if (block.getBoundingClientRect().top <= anchor) current = block;
        });
        return current?.dataset.month || monthItems[0]?.dataset.month || '';
      };

      let ticking = false;
      const sync = () => {
        setActiveMonth(getCurrentMonth());
        const rect = module.getBoundingClientRect();
        const anchor = window.innerHeight * 0.35;
        head.dataset.active = rect.top <= anchor && rect.bottom > anchor ? 'true' : 'false';
      };
      const onScroll = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(() => {
          sync();
          ticking = false;
        });
      };

      sync();
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
    });
  })();
</script>
